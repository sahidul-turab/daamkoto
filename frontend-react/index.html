<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DaamKoto — Compare PC Part Prices in Bangladesh</title>
    <meta
      name="description"
      content="DaamKoto — compare PC component prices across Bangladeshi retailers in one place. Find the cheapest source instantly."
    />
    <meta name="theme-color" content="#0b0b11" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Link previews on Facebook, Messenger and WhatsApp. These crawlers do not run
      JavaScript, so the tags must be static here. og:image must be an absolute URL.
      Never put a shop count in this copy — the number of retailers keeps growing.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DaamKoto" />
    <meta property="og:url" content="https://daamkoto.vercel.app/" />
    <meta property="og:title" content="DaamKoto (দাম কত?) — PC পার্টসের দাম, সব এক জায়গায়" />
    <meta
      property="og:description"
      content="Compare PC part prices across Bangladeshi shops — StarTech, Ryans, Techland and more. Updated every night. Free."
    />
    <meta property="og:image" content="https://daamkoto.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DaamKoto — PC পার্টসের দাম, সব এক জায়গায়" />
    <meta property="og:locale" content="bn_BD" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Start the edge-snapshot handshake before React's entry module runs. -->
    <link rel="preconnect" href="https://daamkoto-img.sahidulturab81.workers.dev" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking first paint. As a plain stylesheet this sits on the
      critical path: the browser will not paint anything until it has fetched
      Google's CSS and then the font files behind it — two extra round trips
      before a single product is visible. Requesting it as `media="print"` makes
      it non-blocking, and flipping the media on load applies it as usual. The
      body has a system-font fallback, so text renders immediately and reflows
      to Inter when it arrives (`display=swap`).
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
