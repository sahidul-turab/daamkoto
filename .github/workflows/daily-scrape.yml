# Daily price refresh for DaamKoto.
#
# Runs the full scrape -> normalize -> match -> load pipeline against the live
# Neon database, so the deployed site refreshes itself with no local machine
# involved. This replaces running `python scheduler.py` by hand.
#
# Categories run as a matrix rather than one after another. Sequentially a full
# sweep measured 4h02m, which left no room to add categories before hitting
# GitHub's 6h job ceiling.
#
# max-parallel is deliberately low. Every category hits the same 15 retailers,
# so N parallel jobs means N times the request rate at each shop - the scrapers
# sleep 2-3s between pages precisely to stay polite, and running 13 at once
# would throw that away and invite a block. Four keeps a full sweep near an
# hour while no shop sees more than four concurrent crawlers.
#
# Schedule: 20:00 UTC = 02:00 Asia/Dhaka.
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#   DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD   (from the Neon pooled URL)
#   R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET

name: Daily scrape

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      categories:
        description: "Space-separated categories (blank = all)"
        required: false
        default: ""
      retailers:
        description: "Space-separated retailers (blank = all 15)"
        required: false
        default: ""

concurrency:
  group: daily-scrape
  cancel-in-progress: false

env:
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  # Neon requires TLS. load.py / scheduler.py call psycopg2.connect() without an
  # sslmode argument, so libpq picks this up from the environment - which is why
  # no Python change was needed to point the pipeline at Neon.
  PGSSLMODE: require
  PYTHONUTF8: "1"

jobs:
  # Turn the optional free-text input into a JSON matrix. Without this the
  # matrix is fixed at author time and a targeted dispatch cannot narrow it.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      categories: ${{ steps.build.outputs.categories }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        run: python scripts/build_matrix.py
        env:
          INPUT_CATEGORIES: ${{ github.event.inputs.categories }}

  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # One broken category must not cancel the other twelve.
      fail-fast: false
      max-parallel: 4
      matrix:
        category: ${{ fromJson(needs.prepare.outputs.categories) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright rapidfuzz psycopg2-binary python-dotenv

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify database connectivity
        run: python scripts/db_check.py

      - name: Scrape ${{ matrix.category }}
        run: |
          # --no-cutouts: background removal happens once in the report job.
          # These matrix jobs deliberately do not hold the R2 credentials, and
          # rembg without them writes local paths that resolve to nothing.
          ARGS="--once --no-cutouts --categories ${{ matrix.category }}"
          if [ -n "${{ github.event.inputs.retailers }}" ]; then
            ARGS="$ARGS --retailers ${{ github.event.inputs.retailers }}"
          fi
          echo "scheduler.py $ARGS"
          python scheduler.py $ARGS

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.category }}
          path: logs/scheduler.log
          if-no-files-found: warn
          retention-days: 14

  # One report over the whole sweep, once every category has settled. Running it
  # per-category would judge retailers against categories that had not run yet.
  report:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # Without this, remove_backgrounds.py stores cutout_path as a relative
      # "/cutouts/<hash>". It refuses to run rather than do that, so a missing
      # secret fails the step loudly instead of silently breaking every image
      # it touches — the table is idempotent and would never retry them.
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install psycopg2-binary python-dotenv boto3

      - name: Freshness report
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.retailers }}" ]; then
            ARGS="--retailers ${{ github.event.inputs.retailers }}"
          fi
          python scripts/freshness_report.py $ARGS

      # Cutouts run here, not per-category, for two reasons: this is the only
      # job with R2 credentials, and rembg is a ~200 MB install that would
      # otherwise be repeated across every category in the matrix.
      - name: Install rembg
        if: ${{ env.R2_ACCESS_KEY_ID != '' }}
        # Pins mirror requirements.txt. Keep them in step: this is the only
        # place rembg is installed for CI, and a silent version drift here shows
        # up as broken cutouts rather than a failed build.
        run: pip install "rembg>=2.0.77" "onnxruntime>=1.27.0" "pillow>=10.0.0"

      - name: Generate product cutouts
        if: ${{ env.R2_ACCESS_KEY_ID != '' }}
        # 4 workers matches the runner's vCPU count. The 6-worker ceiling noted
        # in CLAUDE.md is a memory limit on the dev machine, not a target.
        # --limit bounds a first run with a large backlog; the nightly delta is
        # small once it has caught up.
        run: python scripts/remove_backgrounds.py --workers 4 --limit 3000

      # After cutouts, so the published snapshots carry the new image URLs
      # rather than a set that is one day stale.
      - name: Publish fast-start product snapshots
        if: ${{ env.R2_ACCESS_KEY_ID != '' }}
        run: python scripts/export_bootstrap_snapshots.py --upload

      - name: Heartbeat
        # GitHub disables scheduled workflows on public repos after 60 days with
        # no repository activity. The commit goes to a dedicated branch, never to
        # main, because Vercel and Render auto-deploy on every push to main and a
        # daily redeploy would burn free-tier build minutes for nothing.
        if: always() && github.event_name == 'schedule'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "last scheduled run: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > heartbeat.txt
          git add -f heartbeat.txt
          git commit -m "chore: scheduled-run heartbeat"
          git push --force origin HEAD:refs/heads/ci-heartbeat
